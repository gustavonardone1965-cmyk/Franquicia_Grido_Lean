<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grido · Piloto Lean</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1A2C42">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grido Lean">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Style & CDN Dependencies -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #F4F6F9; font-family: Arial, Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
    #root { width: 100%; min-height: 100vh; }
  </style>

  <!-- React & Recharts via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Polifill para compatibilidad de almacenamiento local en PWA -->
  <script>
    if (!window.storage) {
      window.storage = {
        async get(key) {
          const val = localStorage.getItem(key);
          return val ? { value: val } : null;
        },
        async set(key, val) {
          localStorage.setItem(key, val);
          return true;
        }
      };
    }
  </script>

  <!-- Carga del componente principal del Tablero -->
  <script type="text/babel" src="App.js"></script>

  <!-- Renderizado de la Aplicación -->
  <script type="text/babel">
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>

  <!-- Registro del Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch(err => console.error('Error al registrar el Service Worker:', err));
      });
    }
  </script>
</body>
</html>
